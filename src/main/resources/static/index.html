<!doctype html><html><head><title>Student Management</title><meta charset="UTF-8"><style>
body{font-family:Arial;max-width:900px;margin:40px auto}input,button{padding:9px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ccc;padding:9px}
</style></head><body><h1>Student Management System</h1>
<form id="f"><input id="n" placeholder="Name" required><input id="e" type="email" placeholder="Email" required><input id="c" placeholder="Course" required><button>Add Student</button></form>
<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Action</th></tr></thead><tbody id="t"></tbody></table>
<script>
async function load(){let r=await fetch('/api/students'),a=await r.json();t.innerHTML=a.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.email}</td><td>${s.course}</td><td><button onclick="del(${s.id})">Delete</button></td></tr>`).join('')}
f.onsubmit=async x=>{x.preventDefault();await fetch('/api/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,email:e.value,course:c.value})});f.reset();load()}
async function del(id){await fetch('/api/students/'+id,{method:'DELETE'});load()} load();
</script></body></html>
